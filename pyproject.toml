[project]
name = "mysql-mcp"
version = "0.1.0"
description = "Read-only MySQL MCP server with a SQL safety layer and structured results."
readme = "README.md"
authors = [
    { name = "Philip Antoniades", email = "philip@antoniades.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2,<3",
    "mysql-connector-python>=26.7.0",
    "pydantic>=2",
    "pydantic-settings>=2.16.1",
    "sqlglot>=30.24.0",
]

[project.scripts]
mysql-mcp = "mysql_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PL", "S", "T20"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["mysql.connector.*", "sqlglot.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a live MySQL (MYSQL_MCP_TEST_DSN)",
]
