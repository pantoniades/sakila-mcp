[project]
name = "sakila-mcp"
version = "0.1.0"
description = "General-purpose read-only MySQL MCP server with a SQL safety layer and structured results."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Philip Antoniades", email = "philip@antoniades.com" }
]
requires-python = ">=3.12"
keywords = ["mcp", "mysql", "model-context-protocol", "read-only"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=2,<3",
    "mysql-connector-python>=26.7.0",
    "pydantic>=2",
    "pydantic-settings>=2.16.1",
    # The classifier depends on sqlglot's tokenizer behaviour, verified on 30.x only.
    # uvx users resolve fresh (uv.lock does not reach them), so cap the major version.
    "sqlglot>=30.24.0,<31",
]

[project.urls]
Repository = "https://github.com/pantoniades/sakila-mcp"
Issues = "https://github.com/pantoniades/sakila-mcp/issues"

[project.scripts]
sakila-mcp = "sakila_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Explicit list: without it the sdist takes every file not in .gitignore, so a local
# note or credentials file would ship the day its ignore rule is missing.
[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml", "uv.lock"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PL", "S", "T20"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S608"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["mysql.connector.*", "sqlglot.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a live MySQL (SAKILA_MCP_TEST_DSN)",
]
