name: Release

# Pushing a tag vX.Y.Z publishes that version to PyPI through trusted publishing (OIDC).
# There is no PyPI API token anywhere. PyPI accepts the upload only from this workflow
# file running in the "pypi" environment, which requires a manual approval and accepts
# only v* tags (both configured in the repository settings, not here).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: tag matches version and is on main
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # all branches, for the ancestry check below
      - name: Check the tag
        run: |
          set -euo pipefail
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$GITHUB_REF_TYPE" != tag ] || [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::ref $GITHUB_REF_NAME does not match pyproject.toml version $version (expected tag v$version)"
            exit 1
          fi
          # A tag on a commit that never reached main would publish unreviewed code.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tagged commit $GITHUB_SHA is not on main"
            exit 1
          fi

  # The whole CI matrix, on the tagged commit. Its build job uploads the "dist" artifact,
  # so what gets published is exactly what was checked.
  ci:
    uses: $/.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: publish to PyPI
    needs: [verify, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/sakila-mcp/
    # The only job that can mint an OIDC token. It checks out nothing and runs no
    # project code: it downloads the built files and hands them to the publish action.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
